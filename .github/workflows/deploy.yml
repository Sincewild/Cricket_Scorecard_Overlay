name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/sincewild/cricket-overlay:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: Wait for SSH to be available
        run: |
          for i in $(seq 1 5); do
            if nc -zw 10 "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_PORT }}"; then
              echo "SSH port is open (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: SSH not yet available, retrying in 20s..."
            sleep 20
          done
          echo "SSH port did not become available after 5 attempts"
          exit 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_CLIENT_TIMEOUT: 300
          COMPOSE_HTTP_TIMEOUT: 300
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 15m
          debug: true
          script: |
            set -e
            export DOCKER_CLIENT_TIMEOUT=300
            export COMPOSE_HTTP_TIMEOUT=300
            cd /var/www/Cricket_Scorecard_Overlay

            echo "--- Pulling latest code ---"
            for i in {1..3}; do git pull origin main && break || ([ $i -lt 3 ] && sleep 10); done

            echo "--- Pulling Docker image ---"
            for i in {1..3}; do
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin && break || ([ $i -lt 3 ] && sleep 10)
            done
            for i in {1..3}; do docker compose pull && break || ([ $i -lt 3 ] && sleep 10); done

            echo "--- Restarting container ---"
            docker rm -f cricket-overlay 2>/dev/null || true
            docker compose down --remove-orphans
            docker compose up -d

            echo "--- Cleaning up old images ---"
            docker image prune -f

            echo "--- Deploy complete ---"
            docker compose ps

  smoke:
    name: Smoke Test
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for container to be ready
        run: sleep 30

      - name: Run smoke tests
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh https://overlay.maharj.com
