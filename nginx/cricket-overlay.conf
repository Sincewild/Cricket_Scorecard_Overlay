server {
    listen 80;
    server_name overlay.maharj.com;

    # Redirect HTTP -> HTTPS (uncomment after SSL is set up)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # SSE / long-poll friendly timeouts
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    # Serve logo assets directly via nginx (faster than Node)
    location /logos/ {
        alias /var/www/cricket-overlay/src/logos/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /var/www/cricket-overlay/public/;
        expires 1h;
        add_header Cache-Control "public";
    }
}

