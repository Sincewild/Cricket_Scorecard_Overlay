<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1.0">
  <title>HRCC Logo Overlay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: transparent;
    }

    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
    }

    /* Logo container positioned in top-left corner */
    #logo-container {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      max-width: 120px;
      max-height: 120px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px;
      border-radius: 20px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }

    #logo-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      border-radius: 16px;
    }

    /* ── FULLCARD SCORECARD ── */
    #fullcard-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2000;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border: 2px solid rgba(255, 200, 60, 0.6);
      border-radius: 16px;
      padding: 24px;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      max-width: 800px;
      color: #fff;
    }

    #fullcard-container.show {
      display: block;
      animation: fadeInScale 0.4s ease-out;
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .fullcard-header {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      color: rgba(255, 200, 60, 0.9);
      margin-bottom: 20px;
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 2px;
    }

    .fullcard-teams {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .team-scorecard {
      background: rgba(255, 255, 255, 0.05);
      padding: 16px;
      border-radius: 8px;
      border-left: 4px solid rgba(255, 200, 60, 0.6);
    }

    .team-scorecard h3 {
      font-size: 20px;
      margin-bottom: 12px;
      color: rgba(255, 200, 60, 0.9);
    }

    .team-scorecard .stat {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 16px;
    }

    .team-scorecard .label {
      color: rgba(255, 255, 255, 0.7);
    }

    .team-scorecard .value {
      font-weight: 600;
      color: #fff;
    }

    /* ── DUCK ANIMATION ── */
    #duck-container {
      position: fixed;
      bottom: 20%;
      left: 5%;
      z-index: 1500;
      display: none;
      animation: duckWalkIn 2s ease-out forwards;
    }

    @keyframes duckWalkIn {
      0% {
        left: -100px;
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        left: 80%;
        opacity: 0;
      }
    }

    .duck-emoji {
      font-size: 120px;
      animation: duckBob 0.6s ease-in-out infinite;
    }

    .duck-text {
      position: absolute;
      bottom: -60px;
      left: 20px;
      font-size: 28px;
      color: #ff6b6b;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
      white-space: nowrap;
    }

    @keyframes duckBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    /* ── FIREWORKS ── */
    #fireworks-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1500;
      pointer-events: none;
      display: none;
    }

    .firework {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      pointer-events: none;
    }

    /* ── WICKET CELEBRATION ── */
    #wicket-container {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 1500;
      transform: translate(-50%, -50%);
      display: none;
      opacity: 0;
      animation: wicketPop 3s ease-out forwards;
    }

    @keyframes wicketPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0);
        rotation: 0deg;
      }
      20% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.2);
        rotation: 360deg;
      }
      80% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        rotation: 360deg;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
        rotation: 720deg;
      }
    }

    .wicket-text {
      font-size: 80px;
      font-weight: 700;
      color: rgba(255, 50, 50, 0.9);
      text-shadow: 0 0 30px rgba(255, 50, 50, 0.6);
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 2px;
    }

    /* ── FOUR/SIX CELEBRATION ── */
    #boundary-container {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 1500;
      transform: translate(-50%, -50%);
      display: none;
      opacity: 0;
      animation: boundaryBurst 2.5s ease-out forwards;
    }

    @keyframes boundaryBurst {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
      }
      30% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }
      70% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .boundary-text {
      font-size: 100px;
      font-weight: 700;
      background: linear-gradient(45deg, #ff6b6b, #ffd93d, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 40px rgba(255, 200, 60, 0.6);
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 3px;
    }

    /* ── BATTER SPOTLIGHT ── */
    #batter-spotlight {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1700;
      display: none;
      min-width: 760px;
      background: linear-gradient(180deg, rgba(21, 32, 56, 0.96) 0%, rgba(14, 24, 40, 0.96) 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: 2px solid rgba(255, 26, 78, 0.8);
      border-radius: 20px;
      padding: 14px 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
      opacity: 0;
    }

    #batter-spotlight.show {
      display: block;
      animation: spotlightInOut 6s ease forwards;
    }

    #batter-spotlight.pinned {
      display: block;
      opacity: 1;
      transform: translate(-50%, -50%);
      animation: none;
    }

    @keyframes spotlightInOut {
      0% {
        opacity: 0;
        transform: translate(-50%, -54%) scale(0.95);
      }
      12% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      88% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -46%) scale(0.97);
      }
    }

    .spotlight-toprow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .spotlight-title {
      font-family: 'Barlow Condensed', sans-serif;
      color: rgba(255, 255, 255, 0.96);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .spotlight-context {
      background: linear-gradient(180deg, #ff1a4e 0%, #c4002e 100%);
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .spotlight-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .spotlight-player {
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, rgba(24, 36, 68, 0.95) 0%, rgba(37, 61, 101, 0.92) 100%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 12px;
      min-height: 92px;
      position: relative;
    }

    .spotlight-player::after {
      content: '';
      position: absolute;
      right: 8px;
      top: 16%;
      bottom: 16%;
      width: 2px;
      background: linear-gradient(180deg, transparent, rgba(255,26,78,0.75), transparent);
    }

    .spotlight-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b95 0%, #ff2e68 50%, #b40036 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 24px;
      border: 2px solid rgba(255, 255, 255, 0.42);
      text-transform: uppercase;
      flex-shrink: 0;
      box-shadow: 0 0 14px rgba(255,26,78,0.35);
    }

    .spotlight-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .spotlight-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .spotlight-name {
      color: #fff;
      font-size: 22px;
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 0.8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .strike-pill {
      display: none;
      background: rgba(255, 26, 78, 0.2);
      color: #ff6b95;
      border: 1px solid rgba(255, 26, 78, 0.7);
      border-radius: 999px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 2px 7px;
      flex-shrink: 0;
    }

    .spotlight-score {
      color: rgba(255, 26, 78, 0.98);
      font-size: 20px;
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 0.8px;
    }

    .spotlight-partnership {
      margin-top: 10px;
      text-align: center;
      color: rgba(255, 255, 255, 0.9);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      letter-spacing: 0.9px;
    }


  </style>
</head>
<body>
  <div id="logo-container">
    <img src="/logos/HRCC-logo.jpeg" alt="HRCC Logo" onerror="this.src='/logos/default.png'" />
  </div>

  <!-- Fullcard Scorecard -->
  <div id="fullcard-container">
    <div class="fullcard-header">LIVE SCORECARD</div>
    <div class="fullcard-teams">
      <div class="team-scorecard">
        <h3 id="fullcard-team1">Team 1</h3>
        <div class="stat">
          <span class="label">Runs:</span>
          <span class="value" id="fullcard-score1">-</span>
        </div>
        <div class="stat">
          <span class="label">Wickets:</span>
          <span class="value" id="fullcard-wkts1">-</span>
        </div>
        <div class="stat">
          <span class="label">Overs:</span>
          <span class="value" id="fullcard-overs1">-</span>
        </div>
        <div class="stat">
          <span class="label">CRR:</span>
          <span class="value" id="fullcard-crr1">-</span>
        </div>
      </div>
      <div class="team-scorecard">
        <h3 id="fullcard-team2">Team 2</h3>
        <div class="stat">
          <span class="label">Runs:</span>
          <span class="value" id="fullcard-score2">-</span>
        </div>
        <div class="stat">
          <span class="label">Wickets:</span>
          <span class="value" id="fullcard-wkts2">-</span>
        </div>
        <div class="stat">
          <span class="label">Overs:</span>
          <span class="value" id="fullcard-overs2">-</span>
        </div>
        <div class="stat">
          <span class="label">CRR:</span>
          <span class="value" id="fullcard-crr2">-</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Duck Animation -->
  <div id="duck-container">
    <div class="duck-emoji">🦆</div>
    <div class="duck-text">DUCK! 😢</div>
  </div>

  <!-- Fireworks Container -->
  <div id="fireworks-container"></div>

  <!-- Wicket Celebration -->
  <div id="wicket-container">
    <div class="wicket-text">WICKET!</div>
  </div>

  <!-- Boundary Celebration -->
  <div id="boundary-container">
    <div class="boundary-text">🔥 FOUR/SIX 🔥</div>
  </div>

  <!-- Batter Spotlight -->
  <div id="batter-spotlight">
    <div class="spotlight-toprow">
      <div class="spotlight-title">CURRENT BATTING PAIR</div>
      <div class="spotlight-context" id="spotlight-context">1ST INNINGS</div>
    </div>
    <div class="spotlight-grid">
      <div class="spotlight-player" id="spotlight-player-1">
        <div class="spotlight-avatar" id="spotlight-p1-avatar">--</div>
        <div class="spotlight-meta">
          <div class="spotlight-name-row">
            <div class="spotlight-name" id="spotlight-p1-name">Batter 1</div>
            <span class="strike-pill" id="spotlight-p1-strike">ON STRIKE</span>
          </div>
          <div class="spotlight-score" id="spotlight-p1-score">- (-)</div>
        </div>
      </div>
      <div class="spotlight-player" id="spotlight-player-2">
        <div class="spotlight-avatar" id="spotlight-p2-avatar">--</div>
        <div class="spotlight-meta">
          <div class="spotlight-name-row">
            <div class="spotlight-name" id="spotlight-p2-name">Batter 2</div>
            <span class="strike-pill" id="spotlight-p2-strike">ON STRIKE</span>
          </div>
          <div class="spotlight-score" id="spotlight-p2-score">- (-)</div>
        </div>
      </div>
    </div>
    <div class="spotlight-partnership" id="spotlight-partnership">Partnership: -</div>
  </div>



  <script>
    const query = new URLSearchParams(window.location.search);
    const isSpotlightDemoMode = query.get('demoSpotlight') === '1';
    const isSpotlightPinned = query.get('spotlightAlways') === '1';

    let prevState = {};
    let hasBaselineState = false;
    let fullcardTimeout = null;
    let prevOverCount = 0;
    let prevThisOverLength = 0;
    let spotlightTimeout = null;

    function getInitials(name) {
      const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
      if (parts.length === 0) return '--';
      if (parts.length === 1) return parts[0].slice(0, 2);
      return `${parts[0][0]}${parts[parts.length - 1][0]}`;
    }

    function formatBatterScore(runs, balls) {
      const r = runs !== null && runs !== undefined && runs !== '' ? runs : '-';
      const b = balls !== null && balls !== undefined && balls !== '' ? balls : '-';
      return `${r} (${b})`;
    }

    function formatRate(value) {
      const numeric = Number(value);
      return Number.isFinite(numeric) ? numeric.toFixed(2) : '-';
    }

    function toInt(value) {
      const parsed = Number.parseInt(value, 10);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function getInningsContext(score) {
      if (score.runsNeeded || score.ballsLeft) return 'CHASING';
      if (score.score2 || score.overs2) return '2ND INNINGS';
      return '1ST INNINGS';
    }

    function getPartnershipText(score) {
      const runs = toInt(score.bat1r) + toInt(score.bat2r);
      const balls = toInt(score.bat1b) + toInt(score.bat2b);
      if (runs === 0 && balls === 0) {
        return 'Partnership: -';
      }
      return `Partnership: ${runs} (${balls})`;
    }

    function setSpotlightAvatar(avatarId, batterName, photoUrl) {
      const avatar = document.getElementById(avatarId);
      const initials = getInitials(batterName);

      avatar.textContent = initials;
      avatar.style.backgroundImage = '';
      avatar.style.background = 'radial-gradient(circle at 30% 30%, #ff6b95 0%, #ff2e68 50%, #b40036 100%)';
      avatar.style.backgroundSize = '';
      avatar.style.backgroundPosition = '';
      avatar.style.color = '#fff';

      if (!photoUrl) return;

      const probe = new Image();
      probe.onload = () => {
        avatar.textContent = '';
        avatar.style.background = '';
        avatar.style.backgroundImage = `url("${photoUrl}")`;
        avatar.style.backgroundSize = 'cover';
        avatar.style.backgroundPosition = 'center';
      };
      probe.onerror = () => {
        // Keep initials fallback if remote image URL fails.
      };
      probe.src = photoUrl;
    }

    function showBatterSpotlight(currentScore) {
      if (!currentScore.bat1) return;

      const container = document.getElementById('batter-spotlight');
      const p2Card = document.getElementById('spotlight-player-2');

      document.getElementById('spotlight-p1-name').textContent = currentScore.bat1;
      document.getElementById('spotlight-p1-score').textContent = formatBatterScore(currentScore.bat1r, currentScore.bat1b);
      setSpotlightAvatar('spotlight-p1-avatar', currentScore.bat1, currentScore.bat1Photo);
      document.getElementById('spotlight-p1-strike').style.display = 'inline-flex';
      document.getElementById('spotlight-p2-strike').style.display = 'none';

      if (currentScore.bat2) {
        p2Card.style.display = 'flex';
        document.getElementById('spotlight-p2-name').textContent = currentScore.bat2;
        document.getElementById('spotlight-p2-score').textContent = formatBatterScore(currentScore.bat2r, currentScore.bat2b);
        setSpotlightAvatar('spotlight-p2-avatar', currentScore.bat2, currentScore.bat2Photo);
      } else {
        p2Card.style.display = 'none';
      }

      document.getElementById('spotlight-context').textContent = getInningsContext(currentScore);
      document.getElementById('spotlight-partnership').textContent = getPartnershipText(currentScore);

      clearTimeout(spotlightTimeout);

      if (isSpotlightPinned) {
        container.classList.remove('show');
        container.classList.add('pinned');
      } else {
        container.classList.remove('pinned');
        container.classList.remove('show');
        void container.offsetWidth;
        container.classList.add('show');
        spotlightTimeout = setTimeout(() => {
          container.classList.remove('show');
        }, 6000);
      }
    }

    function checkOverCompletionAndShowBatters(currentScore) {
      const currentThisOverLength = Array.isArray(currentScore.thisOver)
        ? currentScore.thisOver.length
        : 0;

      if (prevThisOverLength >= 5 && currentThisOverLength <= 1) {
        showBatterSpotlight(currentScore);
      }

      prevThisOverLength = currentThisOverLength;
    }

    // Fetch score data
    async function fetchScore() {
      try {
        const response = await fetch('/score');
        const data = await response.json();
        return data;
      } catch (error) {
        console.error('Failed to fetch score:', error);
        throw error;
      }
    }

    // Show fullcard every 2 overs
    function checkAndShowFullcard(currentScore) {
      if (!currentScore.overs1) return;

      const [overs, balls] = currentScore.overs1.toString().split('.').map(Number);
      const currentOverCount = overs || 0;

      // Trigger on every 2-over completion
      if (currentOverCount > 0 && currentOverCount % 2 === 0 && currentOverCount !== prevOverCount) {
        showFullcard(currentScore);
        prevOverCount = currentOverCount;
      }
    }

    function showFullcard(score) {
      clearTimeout(fullcardTimeout);

      // Update fullcard with score data
      document.getElementById('fullcard-team1').textContent = score.team1 || 'Team 1';
      document.getElementById('fullcard-score1').textContent = score.score1 || '-';
      document.getElementById('fullcard-wkts1').textContent = score.wkts1 || '-';
      document.getElementById('fullcard-overs1').textContent = score.overs1 || '-';
      document.getElementById('fullcard-crr1').textContent = formatRate(score.crr);

      document.getElementById('fullcard-team2').textContent = score.team2 || 'Team 2';
      document.getElementById('fullcard-score2').textContent = score.score2 || '-';
      document.getElementById('fullcard-wkts2').textContent = score.wkts2 || '-';
      document.getElementById('fullcard-overs2').textContent = score.overs2 || '-';
      document.getElementById('fullcard-crr2').textContent = formatRate(score.rrr);

      // Show fullcard
      const container = document.getElementById('fullcard-container');
      container.classList.add('show');

      // Hide after 8 seconds
      fullcardTimeout = setTimeout(() => {
        container.classList.remove('show');
      }, 8000);
    }

    // Detect duck (batsman out for 0)
    function checkDuck(currentScore) {
      if (!prevState.bat1r && currentScore.bat1r === 0 && currentScore.bat1 && prevState.bat1 !== currentScore.bat1) {
        showDuck();
      }
    }

    function showDuck() {
      const container = document.getElementById('duck-container');
      container.style.display = 'block';
      container.style.animation = 'none';
      // Trigger reflow to restart animation
      setTimeout(() => {
        container.style.animation = 'duckWalkIn 2s ease-out forwards';
      }, 10);
      setTimeout(() => {
        container.style.display = 'none';
      }, 2000);
    }

    // Detect boundary (4 or 6)
    function checkBoundary(currentScore) {
      const prevRuns = prevState.bat1r || 0;
      const currentRuns = currentScore.bat1r || 0;
      const ballDiff = (currentScore.bat1b || 0) - (prevState.bat1b || 0);

      if (ballDiff === 1 && (currentRuns - prevRuns === 4 || currentRuns - prevRuns === 6)) {
        const runDiff = currentRuns - prevRuns;
        showBoundary(runDiff === 6);
      }
    }

    function showBoundary(isSix) {
      const container = document.getElementById('boundary-container');
      document.querySelector('.boundary-text').textContent = isSix ? '🔥 SIX! 🔥' : '🔥 FOUR! 🔥';
      container.style.display = 'block';
      container.style.animation = 'none';
      setTimeout(() => {
        container.style.animation = 'boundaryBurst 2.5s ease-out forwards';
      }, 10);
      setTimeout(() => {
        container.style.display = 'none';
      }, 2500);
      
      createFireworks();
    }

    // Detect wicket
    function checkWicket(currentScore) {
      const prevWkts = Number(prevState.wkts1) || 0;
      const currentWkts = Number(currentScore.wkts1) || 0;

      if (currentWkts > prevWkts) {
        showWicket();
      }
    }

    function showWicket() {
      const container = document.getElementById('wicket-container');
      container.style.display = 'block';
      container.style.animation = 'none';
      setTimeout(() => {
        container.style.animation = 'wicketPop 3s ease-out forwards';
      }, 10);
      setTimeout(() => {
        container.style.display = 'none';
      }, 3000);
    }

    // Create fireworks effect
    function createFireworks() {
      const container = document.getElementById('fireworks-container');
      container.innerHTML = '';
      container.style.display = 'block';

      const colors = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#FF6BA6'];
      const particleCount = 30;

      for (let i = 0; i < particleCount; i++) {
        const firework = document.createElement('div');
        firework.className = 'firework';
        firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        firework.style.left = '50%';
        firework.style.top = '50%';
        container.appendChild(firework);

        const angle = (Math.PI * 2 * i) / particleCount;
        const velocity = 3 + Math.random() * 8;
        const vx = Math.cos(angle) * velocity;
        const vy = Math.sin(angle) * velocity;

        animateFirework(firework, vx, vy);
      }

      setTimeout(() => {
        container.style.display = 'none';
      }, 2000);
    }

    function animateFirework(element, vx, vy) {
      let x = 0;
      let y = 0;
      let gravity = 0.15;
      let duration = 1500;
      let startTime = Date.now();

      function update() {
        const elapsed = Date.now() - startTime;
        if (elapsed > duration) return;

        x += vx;
        y += vy;
        vy += gravity;

        element.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
        element.style.opacity = 1 - elapsed / duration;

        requestAnimationFrame(update);
      }

      update();
    }

    // Main update loop
    async function updateOverlay() {
      const currentScore = await fetchScore();
      if (!currentScore) return;

      if (!hasBaselineState) {
        prevState = JSON.parse(JSON.stringify(currentScore));
        prevThisOverLength = Array.isArray(currentScore.thisOver) ? currentScore.thisOver.length : 0;
        hasBaselineState = true;
        if (isSpotlightPinned) {
          showBatterSpotlight(currentScore);
        }
        return;
      }

      // Check events
      checkAndShowFullcard(currentScore);
      checkDuck(currentScore);
      checkBoundary(currentScore);
      checkWicket(currentScore);
      checkOverCompletionAndShowBatters(currentScore);
      if (isSpotlightPinned) {
        showBatterSpotlight(currentScore);
      }

      // Update state
      prevState = JSON.parse(JSON.stringify(currentScore));
    }

    function runSpotlightDemo() {
      showBatterSpotlight({
        bat1: 'Virat Kohli',
        bat1r: '57',
        bat1b: '34',
        bat2: 'Rohit Sharma',
        bat2r: '41',
        bat2b: '28'
      });
    }

    // Poll for updates every 5 seconds
    setInterval(updateOverlay, 5000);
    updateOverlay();

    if (isSpotlightDemoMode) {
      setTimeout(runSpotlightDemo, 1200);
    }
  </script>
