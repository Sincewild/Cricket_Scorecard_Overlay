<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1.0">
  <title>JL Logo Overlay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: transparent;
    }

    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
    }

    /* Logo container positioned in top-left corner */
    #logo-container {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      max-width: 120px;
      max-height: 120px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px;
      border-radius: 20px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }

    #logo-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      border-radius: 16px;
    }

    /* ── FULLCARD SCORECARD ── */
    #fullcard-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2000;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border: 2px solid rgba(255, 200, 60, 0.6);
      border-radius: 16px;
      padding: 24px;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      max-width: 800px;
      color: #fff;
    }

    #fullcard-container.show {
      display: block;
      animation: fadeInScale 0.4s ease-out;
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .fullcard-header {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      color: rgba(255, 200, 60, 0.9);
      margin-bottom: 20px;
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 2px;
    }

    .fullcard-teams {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .team-scorecard {
      background: rgba(255, 255, 255, 0.05);
      padding: 16px;
      border-radius: 8px;
      border-left: 4px solid rgba(255, 200, 60, 0.6);
    }

    .team-scorecard h3 {
      font-size: 20px;
      margin-bottom: 12px;
      color: rgba(255, 200, 60, 0.9);
    }

    .team-scorecard .stat {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 16px;
    }

    .team-scorecard .label {
      color: rgba(255, 255, 255, 0.7);
    }

    .team-scorecard .value {
      font-weight: 600;
      color: #fff;
    }

    /* ── DUCK ANIMATION ── */
    #duck-container {
      position: fixed;
      bottom: 20%;
      left: 5%;
      z-index: 1500;
      display: none;
      animation: duckWalkIn 2s ease-out forwards;
    }

    @keyframes duckWalkIn {
      0% {
        left: -100px;
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        left: 80%;
        opacity: 0;
      }
    }

    .duck-emoji {
      font-size: 120px;
      animation: duckBob 0.6s ease-in-out infinite;
    }

    .duck-text {
      position: absolute;
      bottom: -60px;
      left: 20px;
      font-size: 28px;
      color: #ff6b6b;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
      white-space: nowrap;
    }

    @keyframes duckBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    /* ── FIREWORKS ── */
    #fireworks-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1500;
      pointer-events: none;
      display: none;
    }

    .firework {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      pointer-events: none;
    }

    /* ── WICKET CELEBRATION ── */
    #wicket-container {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 1500;
      transform: translate(-50%, -50%);
      display: none;
      opacity: 0;
      animation: wicketPop 3s ease-out forwards;
    }

    @keyframes wicketPop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0);
        rotation: 0deg;
      }
      20% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.2);
        rotation: 360deg;
      }
      80% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        rotation: 360deg;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
        rotation: 720deg;
      }
    }

    .wicket-text {
      font-size: 80px;
      font-weight: 700;
      color: rgba(255, 50, 50, 0.9);
      text-shadow: 0 0 30px rgba(255, 50, 50, 0.6);
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 2px;
    }

    /* ── FOUR/SIX CELEBRATION ── */
    #boundary-container {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 1500;
      transform: translate(-50%, -50%);
      display: none;
      opacity: 0;
      animation: boundaryBurst 2.5s ease-out forwards;
    }

    @keyframes boundaryBurst {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
      }
      30% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }
      70% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .boundary-text {
      font-size: 100px;
      font-weight: 700;
      background: linear-gradient(45deg, #ff6b6b, #ffd93d, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 40px rgba(255, 200, 60, 0.6);
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 3px;
    }

    /* ── BATTER SPOTLIGHT ── */
    #batter-spotlight {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1700;
      display: none;
      min-width: 760px;
      background: linear-gradient(180deg, rgba(21, 32, 56, 0.96) 0%, rgba(14, 24, 40, 0.96) 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: 2px solid rgba(255, 26, 78, 0.8);
      border-radius: 20px;
      padding: 14px 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
      opacity: 0;
    }

    #batter-spotlight.show {
      display: block;
      animation: spotlightInOut 6s ease forwards;
    }

    #batter-spotlight.pinned {
      display: block;
      opacity: 1;
      transform: translate(-50%, -50%);
      animation: none;
    }

    @keyframes spotlightInOut {
      0% {
        opacity: 0;
        transform: translate(-50%, -54%) scale(0.95);
      }
      12% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      88% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -46%) scale(0.97);
      }
    }

    .spotlight-toprow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .spotlight-title {
      font-family: 'Barlow Condensed', sans-serif;
      color: rgba(255, 255, 255, 0.96);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .spotlight-context {
      background: linear-gradient(180deg, #ff1a4e 0%, #c4002e 100%);
      color: #fff;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .spotlight-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .spotlight-player {
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, rgba(24, 36, 68, 0.95) 0%, rgba(37, 61, 101, 0.92) 100%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 12px;
      min-height: 92px;
      position: relative;
    }

    .spotlight-player::after {
      content: '';
      position: absolute;
      right: 8px;
      top: 16%;
      bottom: 16%;
      width: 2px;
      background: linear-gradient(180deg, transparent, rgba(255,26,78,0.75), transparent);
    }

    .spotlight-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff6b95 0%, #ff2e68 50%, #b40036 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 24px;
      border: 2px solid rgba(255, 255, 255, 0.42);
      text-transform: uppercase;
      flex-shrink: 0;
      box-shadow: 0 0 14px rgba(255,26,78,0.35);
    }

    .spotlight-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .spotlight-name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .spotlight-name {
      color: #fff;
      font-size: 22px;
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 0.8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .strike-pill {
      display: none;
      background: rgba(255, 26, 78, 0.2);
      color: #ff6b95;
      border: 1px solid rgba(255, 26, 78, 0.7);
      border-radius: 999px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 2px 7px;
      flex-shrink: 0;
    }

    .spotlight-score {
      color: rgba(255, 26, 78, 0.98);
      font-size: 20px;
      font-family: 'Barlow Condensed', sans-serif;
      letter-spacing: 0.8px;
    }

    .spotlight-partnership {
      margin-top: 10px;
      text-align: center;
      color: rgba(255, 255, 255, 0.9);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      letter-spacing: 0.9px;
    }


  </style>
</head>
<body>
  <div id="logo-container">
    <img src="/logos/JL_Logo.JPG" alt="JL Logo" />
  </div>

  <!-- Fullcard Scorecard -->
  <div id="fullcard-container">
    <div class="fullcard-header">LIVE SCORECARD</div>
    <div class="fullcard-teams">
      <div class="team-scorecard">
        <h3 id="fullcard-team1">Team 1</h3>
        <div class="stat">
          <span class="label">Runs:</span>
          <span class="value" id="fullcard-score1">-</span>
        </div>
        <div class="stat">
          <span class="label">Wickets:</span>
          <span class="value" id="fullcard-wkts1">-</span>
        </div>
        <div class="stat">
          <span class="label">Overs:</span>
          <span class="value" id="fullcard-overs1">-</span>
        </div>
        <div class="stat">
          <span class="label">CRR:</span>
          <span class="value" id="fullcard-crr1">-</span>
        </div>
      </div>
      <div class="team-scorecard">
        <h3 id="fullcard-team2">Team 2</h3>
        <div class="stat">
          <span class="label">Runs:</span>
          <span class="value" id="fullcard-score2">-</span>
        </div>
        <div class="stat">
          <span class="label">Wickets:</span>
          <span class="value" id="fullcard-wkts2">-</span>
        </div>
        <div class="stat">
          <span class="label">Overs:</span>
          <span class="value" id="fullcard-overs2">-</span>
        </div>
        <div class="stat">
          <span class="label">CRR:</span>
          <span class="value" id="fullcard-crr2">-</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Duck Animation -->
  <div id="duck-container">
    <div class="duck-emoji">🦆</div>
    <div class="duck-text">DUCK! 😢</div>
  </div>

  <!-- Fireworks Container -->
  <div id="fireworks-container"></div>

  <!-- Wicket Celebration -->
  <div id="wicket-container">
    <div class="wicket-text">WICKET!</div>
  </div>

  <!-- Boundary Celebration -->
  <div id="boundary-container">
    <div class="boundary-text">🔥 FOUR/SIX 🔥</div>
  </div>

  <!-- Batter Spotlight -->
  <div id="batter-spotlight">
    <div class="spotlight-toprow">
      <div class="spotlight-title">CURRENT BATTING PAIR</div>
      <div class="spotlight-context" id="spotlight-context">1ST INNINGS</div>
    </div>
    <div class="spotlight-grid">
      <div class="spotlight-player" id="spotlight-player-1">
        <div class="spotlight-avatar" id="spotlight-p1-avatar">--</div>
        <div class="spotlight-meta">
          <div class="spotlight-name-row">
            <div class="spotlight-name" id="spotlight-p1-name">Batter 1</div>
            <span class="strike-pill" id="spotlight-p1-strike">ON STRIKE</span>
          </div>
          <div class="spotlight-score" id="spotlight-p1-score">- (-)</div>
        </div>
      </div>
      <div class="spotlight-player" id="spotlight-player-2">
        <div class="spotlight-avatar" id="spotlight-p2-avatar">--</div>
        <div class="spotlight-meta">
          <div class="spotlight-name-row">
            <div class="spotlight-name" id="spotlight-p2-name">Batter 2</div>
            <span class="strike-pill" id="spotlight-p2-strike">ON STRIKE</span>
          </div>
          <div class="spotlight-score" id="spotlight-p2-score">- (-)</div>
        </div>
      </div>
    </div>
    <div class="spotlight-partnership" id="spotlight-partnership">Partnership: -</div>
  </div>



  <script src="/js/team-logo-overlay.js"></script>
</body>
</html>
