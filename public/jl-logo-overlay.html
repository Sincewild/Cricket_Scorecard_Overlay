<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1.0">
  <title>JL Logo Overlay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: transparent;
    }

    body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Logo container positioned in top-left corner */
    #logo-container {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      max-width: 120px;
      max-height: 120px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px;
      border-radius: 20px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }

    #logo-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      border-radius: 16px;
    }
  </style>
</head>
<body>
  <div id="logo-container">
    <img src="/logos/JL_Logo.JPG" alt="JL Logo" />
  </div>
</body>
</html>
