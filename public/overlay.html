<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>Cricket Live Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow+Condensed:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { background: transparent; }

  body {
    background: transparent;
    font-family: 'Rajdhani', 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  /* ── SCOREBAR ── */
  #scorebar {
    position: fixed;
    bottom: 40px;
    left: 0;
    right: 0;
    display: flex;
    align-items: stretch;
    height: 82px;
    font-weight: 600;
    letter-spacing: 0.3px;
    filter: drop-shadow(0 6px 32px rgba(0,0,0,0.75));
    /* gold top-accent line across entire bar */
    border-top: 2px solid rgba(255, 200, 60, 0.55);
  }

  /* LIVE badge */
  #live-badge {
    background: linear-gradient(180deg, #ff1a4e 0%, #c4002e 100%);
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 0 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-width: 50px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  #live-badge::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 60%);
    pointer-events: none;
  }

  #live-badge .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px 2px rgba(255,255,255,0.7);
    animation: live-pulse 1.4s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes live-pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px 2px rgba(255,255,255,0.7); }
    50% { opacity: 0.2; box-shadow: none; }
  }

  /* ── TEAM BLOCKS ── */
  #team1-block {
    background: linear-gradient(135deg, #182444 0%, #253d65 60%, #1a2d50 100%);
    color: #fff;
    padding: 0 14px;
    display: flex;
    flex-direction: row;
    justify-content: flex-start;
    align-items: center;
    gap: 10px;
    min-width: 240px;
    border-right: none;
    position: relative;
  }

  #team1-block::after {
    content: '';
    position: absolute;
    right: 0; top: 12%; bottom: 12%;
    width: 2px;
    background: linear-gradient(180deg, transparent, rgba(255,195,50,0.8), transparent);
  }

  .team-logo {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    display: none;
    border: 2px solid rgba(255,200,60,0.5);
    background: rgba(255,255,255,0.07);
    flex-shrink: 0;
    box-shadow: 0 0 10px rgba(255,200,60,0.2);
  }

  .team-meta {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }

  #team1-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    color: rgba(255,200,60,0.85);
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #team1-score {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 34px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    letter-spacing: 1px;
    text-shadow: 0 0 20px rgba(255,255,255,0.15);
  }

  #team1-overs {
    font-size: 11px;
    color: #7eb8f7;
    font-weight: 600;
    margin-top: 1px;
    letter-spacing: 0.5px;
  }

  /* VS block */
  #vs-block {
    background: linear-gradient(180deg, #ff1a4e 0%, #c4002e 100%);
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 2px;
    padding: 0 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  #vs-block::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 55%);
    pointer-events: none;
  }

  /* Team 2 */
  #team2-block {
    background: linear-gradient(135deg, #182444 0%, #1a3a6a 60%, #152240 100%);
    color: #fff;
    padding: 0 14px;
    display: flex;
    flex-direction: row;
    justify-content: flex-start;
    align-items: center;
    gap: 10px;
    min-width: 240px;
    position: relative;
  }

  #team2-block::before {
    content: '';
    position: absolute;
    left: 0; top: 12%; bottom: 12%;
    width: 2px;
    background: linear-gradient(180deg, transparent, rgba(255,195,50,0.8), transparent);
  }

  #team2-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    color: rgba(255,200,60,0.85);
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #team2-score {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 34px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    letter-spacing: 1px;
    text-shadow: 0 0 20px rgba(255,255,255,0.15);
  }

  #team2-overs {
    font-size: 11px;
    color: #7eb8f7;
    font-weight: 600;
    margin-top: 1px;
    letter-spacing: 0.5px;
  }

  /* ── PANEL BASE — glass dark ── */
  #match-info,
  #batsmen-strip,
  #bowler-strip,
  #lastball-strip {
    background: linear-gradient(180deg, #152038 0%, #0e1828 100%);
    border-left: 1px solid rgba(255,255,255,0.07);
  }

  /* Match info panel */
  #match-info {
    color: #cdd3e0;
    padding: 0 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 0.45;
    min-width: 120px;
    overflow: hidden;
  }

  #info-mode-simple {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  #info-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 8px;
    color: rgba(255,200,60,0.6);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
  }

  #info-crr-simple {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    color: #ffd040;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  #info-result-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    color: #ffd040;
    font-weight: 700;
    display: flex;
    align-items: center;
    overflow: hidden;
    white-space: nowrap;
    min-width: 0;
    position: relative;
  }

  #info-result-text.scrolling {
    mask-image: linear-gradient(to right, transparent 0, black 10px, black calc(100% - 10px), transparent 100%);
  }

  #info-result-track {
    display: inline-flex;
    align-items: center;
    gap: 36px;
    white-space: nowrap;
    will-change: transform;
    backface-visibility: hidden;
    transform: translate3d(0, 0, 0);
  }

  #info-result-text.scrolling #info-result-track {
    animation: marquee 18s linear infinite;
  }

  #info-result-track .result-copy {
    flex: 0 0 auto;
    white-space: nowrap;
  }

  @keyframes marquee {
    from { transform: translate3d(0, 0, 0); }
    to { transform: translate3d(-50%, 0, 0); }
  }

  #info-mode-chase {
    display: none;
    flex-direction: column;
    gap: 2px;
  }

  #info-need {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 800;
    color: #fff;
    white-space: nowrap;
    letter-spacing: 0.3px;
  }

  #info-need .need-runs  { color: #ff7a55; }
  #info-need .need-balls { color: #90a0b8; }

  #info-rr {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .info-rr-label { color: rgba(255,200,60,0.55); margin-right: 4px; font-weight: 600; letter-spacing: 1px; font-size: 9px; }
  .info-crr-val  { color: #ffd040; font-weight: 700; }
  .info-rrr-val  { color: #ff7a55; font-weight: 700; }

  /* ── BATSMEN ── */
  #batsmen-strip {
    color: #fff;
    padding: 0 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    flex: 0.55;
    min-width: 220px;
  }

  #batsmen-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 8px;
    color: rgba(255,200,60,0.6);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
    margin-bottom: 1px;
  }

  .batsman-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .batsman-name {
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    color: #d8e0ee;
    font-weight: 600;
    max-width: 150px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: 0.3px;
  }

  .batsman-name.on-strike {
    color: #fff;
  }

  .batsman-name.on-strike::after {
    content: ' ❯';
    color: #ffd040;
    font-size: 10px;
  }

  .batsman-stat {
    font-family: 'Barlow Condensed', sans-serif;
    color: #7eb8f7;
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    letter-spacing: 0.5px;
  }

  .batsman-sr {
    color: #445566;
    font-size: 10px;
    margin-left: 4px;
  }

  /* ── BOWLER ── */
  #bowler-strip {
    color: #fff;
    padding: 0 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 0.45;
    min-width: 190px;
  }

  #bowler-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 8px;
    color: rgba(255,200,60,0.6);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  #bowler-name {
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    color: #d8e0ee;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 140px;
    letter-spacing: 0.3px;
  }

  #bowler-stat {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    color: #f9a64a;
    font-weight: 700;
    margin-top: 2px;
    letter-spacing: 0.5px;
  }

  /* ── THIS OVER BALLS ── */
  #lastball-strip {
    padding: 0 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-width: 130px;
    flex-shrink: 0;
  }

  #lastball-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 8px;
    color: rgba(255,200,60,0.6);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  #balls-row {
    display: flex;
    gap: 5px;
  }

  .ball {
    width: 24px; height: 24px;
    border-radius: 50%;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #131f2e;
    color: #3a4f66;
    border: 1px solid rgba(255,255,255,0.06);
  }

  .ball.four   { background: #0d3d1e; color: #3eff82; border-color: rgba(62,255,130,0.3); box-shadow: 0 0 8px rgba(62,255,130,0.25); }
  .ball.six    { background: #3d0d1e; color: #ff6b8a; border-color: rgba(255,107,138,0.3); box-shadow: 0 0 8px rgba(255,107,138,0.3); }
  .ball.wicket { background: #c4002e; color: #fff;    border-color: rgba(255,60,100,0.5);  box-shadow: 0 0 10px rgba(196,0,46,0.6); }
  .ball.wide   { background: #2e2900; color: #ffd040; border-color: rgba(255,208,64,0.25); }
  .ball.noball { background: #2e1800; color: #ff9a44; border-color: rgba(255,154,68,0.25); }
  .ball.dot    { background: #0a1520; color: #2a3d52; border-color: rgba(255,255,255,0.04); }
  .ball.run    { background: #131f2e; color: #c0d0e8; border-color: rgba(255,255,255,0.08); }

  /* ── REFRESH INDICATOR ── */
  #refresh-indicator {
    position: fixed;
    bottom: 116px;
    right: 14px;
    font-family: 'Barlow Condensed', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.5px;
  }

  /* ── ERROR BANNER ── */
  #error-banner {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0;
    background: rgba(196,0,46,0.9);
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 6px 16px;
    text-align: center;
  }

  @media (max-width: 1360px) {
    #lastball-strip { display: none; }
  }

  @media (max-width: 1180px) {
    #match-info { min-width: 90px; padding: 0 6px; flex: 0.35; }
    #team1-block, #team2-block { min-width: 160px; }
    #batsmen-strip { min-width: 240px; flex: 0.7; }
    #bowler-strip  { min-width: 200px; flex: 0.55; }
  }

  /* ── DUCK VIDEO ── */
  #duck-video-container {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 100;
    background: transparent;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 40px;
  }

  #duck-video-container.show {
    display: flex;
  }

  #duck-video {
    max-width: 40vw;
    max-height: 80vh;
    height: 400px;
    object-fit: contain;
  }

  /* ── RESULT BANNER ── */
  #result-banner {
    display: none;
    position: fixed;
    left: 50%;
    top: 18px;
    transform: translateX(-50%);
    z-index: 30;
    padding: 13px 28px;
    border-radius: 999px;
    color: #fff9dc;
    background: linear-gradient(135deg, rgba(220,0,55,0.97), rgba(255,120,0,0.94));
    border: 1px solid rgba(255,220,80,0.25);
    box-shadow: 0 10px 40px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.06) inset;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
  }

  #result-banner.show {
    display: flex;
    align-items: center;
    gap: 14px;
    animation: result-pop 420ms cubic-bezier(0.34,1.56,0.64,1);
  }

  .result-banner-text { position: relative; z-index: 2; }

  .result-spark {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #fff3b0;
    box-shadow:
      18px -18px 0 0 rgba(255,255,255,0.95),
      -18px -18px 0 0 rgba(255,216,79,0.95),
      18px 18px 0 0 rgba(255,122,0,0.95),
      -18px 18px 0 0 rgba(255,255,255,0.95);
    animation: spark-bounce 1s ease-in-out infinite alternate;
  }

  .result-spark.right { animation-delay: 140ms; }

  @keyframes result-pop {
    from { transform: translateX(-50%) scale(0.85); opacity: 0; }
    to   { transform: translateX(-50%) scale(1);    opacity: 1; }
  }

  @keyframes spark-bounce {
    from { transform: scale(0.95) rotate(0deg); opacity: 0.7; }
    to   { transform: scale(1.15) rotate(18deg); opacity: 1; }
  }

  /* ── FULL SCORECARD (shown after each over) ── */
  #fullscorecard-overlay {
    display: none;
    position: fixed;
    top: 170px;
    left: 40px;
    right: 40px;
    gap: 20px;
    filter: drop-shadow(0 6px 32px rgba(0,0,0,0.75));
    z-index: 40;
  }

  #fullscorecard-overlay.show {
    display: flex;
  }

  #fullscorecard-overlay .innings-panel {
    flex: 1;
    background: linear-gradient(180deg, #152038 0%, #0e1828 100%);
    border: 1px solid rgba(255,255,255,0.07);
    border-top: 2px solid rgba(255, 200, 60, 0.55);
    border-radius: 6px;
    overflow: hidden;
  }

  #fullscorecard-overlay .innings-header {
    background: linear-gradient(135deg, #182444 0%, #253d65 60%, #1a2d50 100%);
    color: #fff;
    padding: 8px 14px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(255,200,60,0.3);
  }

  #fullscorecard-overlay .innings-header .vs {
    color: rgba(255,200,60,0.85);
    font-weight: 600;
    margin-left: 6px;
  }

  #fullscorecard-overlay .section-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 9px;
    color: rgba(255,200,60,0.6);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
    padding: 8px 14px 4px;
  }

  #fullscorecard-overlay table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  #fullscorecard-overlay th {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 9px;
    color: rgba(255,200,60,0.6);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    text-align: left;
    padding: 2px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }

  #fullscorecard-overlay th.num, #fullscorecard-overlay td.num { text-align: right; padding-right: 14px; }

  #fullscorecard-overlay td {
    color: #d8e0ee;
    font-weight: 600;
    padding: 3px 14px;
    letter-spacing: 0.3px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  #fullscorecard-overlay td.name {
    font-family: 'Rajdhani', sans-serif;
    color: #fff;
  }

  #fullscorecard-overlay td.stat {
    font-family: 'Barlow Condensed', sans-serif;
    color: #7eb8f7;
  }

  #fullscorecard-overlay .empty-row td {
    color: #445566;
    font-style: italic;
    text-align: center;
  }

  #fullscorecard-overlay td.dismissal {
    font-family: 'Rajdhani', sans-serif;
    color: #7a8aa0;
    font-size: 11px;
  }
</style>
</head>
<body>

<!-- 1px anchor prevents YOLOBox from treating the page as blank and auto-hiding -->
<div style="position:fixed;top:0;left:0;width:1px;height:1px;background:#010101;opacity:0.01;pointer-events:none;"></div>
<div id="duck-video-container">
  <video id="duck-video" playsinline autoplay>
    <source src="/animation/duck-alpha.webm" type="video/webm">
    <source src="/animation/duck-sample1-2.mp4" type="video/mp4">
  </video>
</div>
<div id="error-banner"></div>
<div id="result-banner">
  <span class="result-spark"></span>
  <span class="result-banner-text" id="result-banner-text">Jersey Lions won by 62 Runs</span>
  <span class="result-spark right"></span>
</div>

<div id="fullscorecard-overlay"></div>

<div id="scorebar">
  <div id="live-badge">
    <span class="dot"></span>LIVE
  </div>

  <div id="team1-block">
    <img id="team1-logo" class="team-logo" alt="Team 1 logo">
    <div class="team-meta">
      <div id="team1-name">Team 1</div>
      <div id="team1-score">— / —</div>
      <div id="team1-overs">0.0 overs</div>
    </div>
  </div>

  <div id="vs-block">VS</div>

  <div id="team2-block">
    <img id="team2-logo" class="team-logo" alt="Team 2 logo">
    <div class="team-meta">
      <div id="team2-name">Team 2</div>
      <div id="team2-score">Yet to bat</div>
      <div id="team2-overs"></div>
    </div>
  </div>

  <div id="match-info">
    <!-- Simple mode: 1st innings or match over -->
    <div id="info-mode-simple">
      <div id="info-label">1st Innings</div>
      <div id="info-crr-simple">CRR —</div>
      <div id="info-result-text" style="display:none">
        <span id="info-result-track">
          <span class="result-copy" id="info-result-copy-1">—</span>
          <span class="result-copy" id="info-result-copy-2">—</span>
        </span>
      </div>
    </div>
    <!-- Chase mode: 2nd innings live -->
    <div id="info-mode-chase">
      <div id="info-need">Need <span class="need-runs" id="info-runs">—</span> off <span class="need-balls" id="info-balls">—</span> balls</div>
      <div id="info-rr">
        <span><span class="info-rr-label">CRR</span><span class="info-crr-val" id="info-crr">—</span></span>
        <span><span class="info-rr-label">RRR</span><span class="info-rrr-val" id="info-rrr">—</span></span>
      </div>
    </div>
  </div>

  <div id="batsmen-strip">
    <div id="batsmen-label">Batting Now</div>
    <div class="batsman-row" id="bat1-row">
      <span class="batsman-name" id="bat1-name">—</span>
      <span class="batsman-stat" id="bat1-stat">—</span>
    </div>
    <div class="batsman-row" id="bat2-row">
      <span class="batsman-name" id="bat2-name">—</span>
      <span class="batsman-stat" id="bat2-stat">—</span>
    </div>
  </div>

  <div id="bowler-strip">
    <div id="bowler-label">Bowling Now</div>
    <div id="bowler-name">—</div>
    <div id="bowler-stat">— — —</div>
  </div>

  <div id="lastball-strip">
    <div id="lastball-label">This Over</div>
    <div id="balls-row"></div>
  </div>

</div>

<div id="refresh-indicator">Next update in <span id="countdown">30</span>s</div>

<script>
  // ── Config: point to your Render server ──
  // Change this to your Render URL after deployment
  const SERVER_URL = window.location.origin;
  const REFRESH_EVERY = 20;
  let hasReceivedData = false;
  const params = new URLSearchParams(window.location.search);
  const DEFAULT_TEAM_LOGO = `${window.location.origin}/logos/default.png`;
  const FALLBACK_TEAM1_LOGO = params.get('team1Logo') || params.get('logo1') || '';
  const FALLBACK_TEAM2_LOGO = params.get('team2Logo') || params.get('logo2') || '';

  // Duck detection state
  let prevBat1Name = null;
  let prevBat1Runs = null;

  function safeLogoUrl(value) {
    if (!value || typeof value !== 'string') return '';

    try {
      const parsed = new URL(value, window.location.origin);
      if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
        return parsed.toString();
      }
    } catch (e) {
      return '';
    }

    return '';
  }

  function setTeamLogo(imgId, logoUrl) {
    const img = document.getElementById(imgId);
    const safeUrl = safeLogoUrl(logoUrl) || DEFAULT_TEAM_LOGO;

    img.onerror = () => {
      // Fallback to bundled default logo for missing/broken team assets.
      if (img.src !== DEFAULT_TEAM_LOGO) {
        img.src = DEFAULT_TEAM_LOGO;
        img.style.display = 'block';
        return;
      }
      img.style.display = 'none';
      img.removeAttribute('src');
    };
    img.onload = () => {
      img.style.display = 'block';
    };
    img.src = safeUrl;
  }

  function renderBall(val) {
    if (!val) return '';
    const v = String(val).toUpperCase().trim();
    let cls = 'run', label = v;
    if (v === '0' || v === '.')  { cls = 'dot';    label = '0'; }
    else if (v === '4')          { cls = 'four';   label = '4'; }
    else if (v === '6')          { cls = 'six';    label = '6'; }
    else if (v === 'W')          { cls = 'wicket'; label = 'W'; }
    else if (v === 'WD' || v === 'WB' || v === 'WIDE') { cls = 'wide'; label = 'wd'; }
    else if (v === 'NB')         { cls = 'noball'; label = 'nb'; }
    return `<div class="ball ${cls}">${label}</div>`;
  }

  // ── Full scorecard shown for FULLSCORECARD_DISPLAY_MS after each completed over ──
  const FULLSCORECARD_DISPLAY_MS = 8000;
  let prevBallsBowled = null;
  let fullscorecardHideTimer = null;

  function oversToBalls(oversStr) {
    if (oversStr === null || oversStr === undefined || oversStr === '') return null;
    const parts = String(oversStr).split('.');
    const overs = parseInt(parts[0], 10) || 0;
    const balls = parseInt(parts[1], 10) || 0;
    return overs * 6 + balls;
  }

  function buildScorecardTable(rows, columns) {
    const head = `<tr>${columns.map(c => `<th${c.num ? ' class="num"' : ''}>${c.label}</th>`).join('')}</tr>`;
    let body;
    if (!rows || rows.length === 0) {
      body = `<tr class="empty-row"><td colspan="${columns.length}">No data yet</td></tr>`;
    } else {
      body = rows.map(row => `<tr>${columns.map((c, i) => {
        const cls = c.cls || (i === 0 ? 'name' : (c.num ? 'num stat' : 'stat'));
        return `<td class="${cls}">${row[c.key] ?? '—'}</td>`;
      }).join('')}</tr>`).join('');
    }
    return `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
  }

  function buildScorecardInnings(innings, fallbackBattingTeam, fallbackBowlingTeam) {
    if (!innings) {
      innings = { battingTeam: fallbackBattingTeam, batting: [], bowlingTeam: fallbackBowlingTeam, bowling: [] };
    }

    const battingCols = [
      { key: 'name', label: 'Batter' },
      { key: 'dismissal', label: '', cls: 'dismissal' },
      { key: 'runs', label: 'R', num: true },
      { key: 'balls', label: 'B', num: true },
      { key: 'fours', label: '4s', num: true },
      { key: 'sixes', label: '6s', num: true },
      { key: 'sr', label: 'SR', num: true }
    ];

    const bowlingCols = [
      { key: 'name', label: 'Bowler' },
      { key: 'overs', label: 'O', num: true },
      { key: 'maidens', label: 'M', num: true },
      { key: 'dots', label: 'Dot', num: true },
      { key: 'runs', label: 'R', num: true },
      { key: 'wkts', label: 'W', num: true },
      { key: 'econ', label: 'Econ', num: true }
    ];

    return `
      <div class="innings-panel">
        <div class="innings-header">${innings.battingTeam || fallbackBattingTeam || 'Team'} <span class="vs">batting</span></div>
        ${buildScorecardTable(innings.batting, battingCols)}
        <div class="section-label">Bowling — ${innings.bowlingTeam || fallbackBowlingTeam || 'Team'}</div>
        ${buildScorecardTable(innings.bowling, bowlingCols)}
      </div>
    `;
  }

  function showFullScorecard(data) {
    const overlay = document.getElementById('fullscorecard-overlay');
    const sc = data.scorecard || {};
    overlay.innerHTML =
      buildScorecardInnings(sc.innings1, data.team1, data.team2) +
      buildScorecardInnings(sc.innings2, data.team2, data.team1);
    overlay.classList.add('show');

    if (fullscorecardHideTimer) clearTimeout(fullscorecardHideTimer);
    fullscorecardHideTimer = setTimeout(() => {
      overlay.classList.remove('show');
    }, FULLSCORECARD_DISPLAY_MS);
  }

  function checkOverFinished(data) {
    const isMatchOver = data.status && /\bwon by\b/i.test(data.status);
    if (isMatchOver) return;

    const liveOvers = (data.score2 !== null && data.score2 !== undefined) ? data.overs2 : data.overs1;
    const balls = oversToBalls(liveOvers);
    if (balls === null) return;

    if (prevBallsBowled !== null && balls > prevBallsBowled && balls % 6 === 0) {
      showFullScorecard(data);
    }
    prevBallsBowled = balls;
  }

  function playDuckVideo() {
    const container = document.getElementById('duck-video-container');
    const video = document.getElementById('duck-video');
    
    if (!container || !video) return;
    
    container.classList.add('show');
    video.currentTime = 0;
    video.play().catch(err => console.warn('Duck video play error:', err));
    
    // Hide video when it finishes or after 10 seconds
    const hideVideo = () => {
      container.classList.remove('show');
      video.removeEventListener('ended', hideVideo);
      clearTimeout(hideTimer);
    };
    
    const hideTimer = setTimeout(hideVideo, 10000);
    video.addEventListener('ended', hideVideo, { once: true });
  }

  function updateUI(data) {
    checkOverFinished(data);

    // Teams
    document.getElementById('team1-name').textContent = data.team1 || 'Team 1';
    document.getElementById('team2-name').textContent = data.team2 || 'Team 2';

    // Team logos (API value first, then URL fallback)
    setTeamLogo('team1-logo', data.team1Logo || FALLBACK_TEAM1_LOGO);
    setTeamLogo('team2-logo', data.team2Logo || FALLBACK_TEAM2_LOGO);

    // Score 1
    if (data.score1 !== null && data.score1 !== undefined) {
      document.getElementById('team1-score').textContent = `${data.score1}/${data.wkts1}`;
      document.getElementById('team1-overs').textContent = `${data.overs1} overs`;
    }

    // Score 2
    if (data.score2 !== null && data.score2 !== undefined) {
      document.getElementById('team2-score').textContent = `${data.score2}/${data.wkts2}`;
      document.getElementById('team2-overs').textContent = `${data.overs2} overs`;
    } else {
      document.getElementById('team2-score').textContent = 'Yet to bat';
      document.getElementById('team2-overs').textContent = '';
    }

    // ── Inning-aware match-info panel ─────────────────────────────────────
    const isMatchOver = data.status && /\bwon by\b/i.test(data.status);
    const isChasing   = !isMatchOver && data.rrr !== null && data.rrr !== undefined;
    const liveBadge   = document.getElementById('live-badge');
    const resultBanner = document.getElementById('result-banner');
    const resultBannerText = document.getElementById('result-banner-text');

    if (liveBadge) {
      liveBadge.style.display = isMatchOver ? 'none' : 'flex';
    }
    if (resultBanner) {
      if (isMatchOver) {
        resultBannerText.textContent = data.status;
        resultBanner.classList.add('show');
      } else {
        resultBanner.classList.remove('show');
        resultBannerText.textContent = '';
      }
    }

    const simpleMode = document.getElementById('info-mode-simple');
    const chaseMode  = document.getElementById('info-mode-chase');

    if (isChasing) {
      simpleMode.style.display = 'none';
      chaseMode.style.display  = 'flex';
      document.getElementById('info-runs').textContent  = data.runsNeeded || '—';
      document.getElementById('info-balls').textContent = data.ballsLeft   || '—';
      document.getElementById('info-crr').textContent   = data.crr ? parseFloat(data.crr).toFixed(2) : '—';
      document.getElementById('info-rrr').textContent   = data.rrr ? parseFloat(data.rrr).toFixed(2) : '—';
    } else {
      simpleMode.style.display = 'flex';
      chaseMode.style.display  = 'none';
      const label      = document.getElementById('info-label');
      const crrSimple  = document.getElementById('info-crr-simple');
      const resultText = document.getElementById('info-result-text');
      const resultCopy1 = document.getElementById('info-result-copy-1');
      const resultCopy2 = document.getElementById('info-result-copy-2');
      const resultTrack = document.getElementById('info-result-track');
      if (isMatchOver) {
        label.style.display      = 'none';
        crrSimple.style.display  = 'none';
        resultText.style.display = 'block';
        resultCopy1.textContent  = data.status;
        resultCopy2.textContent  = data.status;
        resultText.classList.remove('scrolling');
        if (resultTrack) {
          requestAnimationFrame(() => {
            if (resultTrack.scrollWidth > resultText.clientWidth + 8) {
              resultText.classList.add('scrolling');
            }
          });
        }
      } else {
        label.style.display      = 'block';
        label.textContent        = '1st Innings';
        resultText.style.display = 'none';
        resultText.classList.remove('scrolling');
        crrSimple.style.display  = 'block';
        crrSimple.textContent    = data.crr ? `CRR  ${parseFloat(data.crr).toFixed(2)}` : 'Live';
      }
    }

    // Batsmen
    if (data.bat1) {
      document.getElementById('bat1-name').classList.add('on-strike');
      document.getElementById('bat1-name').textContent = data.bat1;
      const sr1 = data.bat1sr ? ` · SR ${data.bat1sr}` : '';
      document.getElementById('bat1-stat').textContent = `${data.bat1r} (${data.bat1b})${sr1}`;

      // Duck detection: previous on-strike batter left the crease entirely (not just
      // strike rotation to bat2) while still on 0 runs — i.e. got out for a duck.
      if (prevBat1Name && prevBat1Name !== data.bat1 && prevBat1Name !== data.bat2 && Number(prevBat1Runs) === 0) {
        playDuckVideo();
      }

      // Update state for next comparison
      prevBat1Name = data.bat1;
      prevBat1Runs = data.bat1r;
    } else {
      document.getElementById('bat1-name').classList.remove('on-strike');
      document.getElementById('bat1-name').textContent = 'No batter data';
      document.getElementById('bat1-stat').textContent = '—';
      prevBat1Name = null;
      prevBat1Runs = null;
    }
    if (data.bat2) {
      document.getElementById('bat2-row').style.display = 'flex';
      document.getElementById('bat2-name').textContent = data.bat2;
      const sr2 = data.bat2sr ? ` · SR ${data.bat2sr}` : '';
      document.getElementById('bat2-stat').textContent = `${data.bat2r} (${data.bat2b})${sr2}`;
    } else {
      document.getElementById('bat2-row').style.display = 'none';
    }

    // Bowler
    if (data.bowler) {
      document.getElementById('bowler-name').textContent = data.bowler;
      const eco = data.bowlerEco ? ` · Eco ${data.bowlerEco}` : '';
      document.getElementById('bowler-stat').textContent =
        `${data.bowlerO || '—'} ov  ${data.bowlerW || 0}-${data.bowlerR || 0}${eco}`;
    } else {
      document.getElementById('bowler-name').textContent = 'No bowler data';
      document.getElementById('bowler-stat').textContent = '—';
    }

    // Track that data arrived (for offline detection)
    if (data.lastUpdated) hasReceivedData = true;

    // This over
    if (data.thisOver && data.thisOver.length > 0) {
      document.getElementById('balls-row').innerHTML = data.thisOver.slice(0,8).map(renderBall).join('');
    } else {
      document.getElementById('balls-row').innerHTML = '';
    }

    // Error
    const errBanner = document.getElementById('error-banner');
    if (data.error) {
      errBanner.style.display = 'block';
      errBanner.textContent = `⚠ ${data.error}`;
    } else {
      errBanner.style.display = 'none';
    }
  }

  async function fetchScore() {
    try {
      const resp = await fetch(`${SERVER_URL}/score`, { cache: 'no-store' });
      if (!resp.ok) throw new Error(`Server error ${resp.status}`);
      const data = await resp.json();
      updateUI(data);
    } catch (e) {
      console.warn('Fetch error:', e.message);
      const label     = document.getElementById('info-label');
      const crrSimple = document.getElementById('info-crr-simple');
      document.getElementById('info-mode-simple').style.display = 'flex';
      document.getElementById('info-mode-chase').style.display  = 'none';
      document.getElementById('info-result-text').style.display = 'none';
      document.getElementById('info-result-text').classList.remove('scrolling');
      if (label)     label.textContent    = hasReceivedData ? 'Connection Lost' : 'Server Offline';
      if (crrSimple) crrSimple.textContent = hasReceivedData ? 'Reconnecting...' : 'Start server and set match URL';
    }
  }

  // Countdown timer
  let countdown = REFRESH_EVERY;

  // Show static/fallback logos immediately even before live score arrives.
  setTeamLogo('team1-logo', FALLBACK_TEAM1_LOGO);
  setTeamLogo('team2-logo', FALLBACK_TEAM2_LOGO);

  setInterval(() => {
    countdown--;
    document.getElementById('countdown').textContent = countdown;
    if (countdown <= 0) {
      countdown = REFRESH_EVERY;
      fetchScore();
    }
  }, 1000);

  // Initial fetch
  fetchScore();
</script>
</body>
</html>
